<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>การ์ดในกล่อง (ร่าง)</title>
<style>
  body{margin:0;background:#F3F2EF;font-family:system-ui,sans-serif;color:#111827}
  main{max-width:560px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:28px}
  h1{font-size:20px;margin:0}
  p{margin:4px 0 0;color:#6B7280;font-size:14px;line-height:1.6}
  figure{margin:0;display:flex;flex-direction:column;gap:10px}
  figcaption{font-size:15px;font-weight:600}

<body>
<main>
  <div><h1>การ์ดในกล่อง (ร่าง)</h1><p>ขนาด A6 105 × 148 มม. QR และข้อความยังเป็นตัวอย่าง</p></div>
  <figure><figcaption>การ์ดหิน ด้านหน้า</figcaption><img src="assets/card-front.jpg" alt="การ์ดหิน ด้านหน้า"></figure>
  <figure><figcaption>การ์ดหิน ด้านหลัง</figcaption><img src="assets/card-back.jpg" alt="การ์ดหิน ด้านหลัง"></figure>
  <figure><figcaption>การ์ดเขียนมือ (personalised)</figcaption><img src="assets/card-personalised.jpg" alt="การ์ดเขียนมือ"></figure>
</main>
